name: selftest
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline logic tests (no network)
        run: python3 poller.py --selftest
      - name: Config parses and is structurally valid
        run: |
          python3 - <<'PY'
          import json
          cfg = json.load(open('companies.json'))
          for e in cfg['companies']:
              if e.get('disabled'): continue
              if e['ats'] == 'workday':
                  assert all(e.get(k) for k in ('host','tenant','site')), e['company']
              else:
                  assert e.get('token'), e['company']
          print(f"{len(cfg['companies'])} companies validated")
          PY
