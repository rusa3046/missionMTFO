name: daily digest

on:
  schedule:
    # GitHub cron is UTC and does NOT observe DST, so 07:00 Pacific is two
    # different UTC hours depending on the season. Both entries fire year-round;
    # the guard step below drops whichever one is not 07:00 in Los Angeles today.
    - cron: '0 14 * * *'   # 07:00 PDT (roughly Mar–Nov)
    - cron: '0 15 * * *'   # 07:00 PST (roughly Nov–Mar)
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        default: digest
        options: [digest, seed, verify, health, fix-tokens, inspect]
      allow_ats_switch:
        description: 'fix-tokens only: let a company move between ATSes (review the dry run first)'
        type: boolean
        default: false
      urls:
        description: 'inspect only: careers page URLs, separated by spaces'
        type: string
        default: ''

permissions:
  contents: write          # the run commits seen.db back to the branch

concurrency:
  # Runs share one SQLite file, so they must never overlap. Queue, don't cancel:
  # a cancelled run could die between sending the email and committing the DB.
  group: job-poller-state
  cancel-in-progress: false

jobs:
  # Named for what it is, not for one of its modes: the run history shows this
  # job name regardless of which mode you dispatched, so "digest" here was
  # actively misleading when you ran verify.
  poll:
    runs-on: ubuntu-latest
    # A hung ATS endpoint must not burn the monthly Actions budget. The poller's
    # own per-request timeouts should fire long before this does.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the rebase-and-retry path below has something to
          # rebase onto; a shallow clone makes `git pull --rebase` unreliable.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Has today's digest already run?
        id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          LA = ZoneInfo("America/Los_Angeles")
          now = datetime.now(LA)
          event = os.environ["EVENT"]

          def last_digest_date():
              """Pacific date of the most recent digest in runs.log, or None."""
              try:
                  lines = open("runs.log").read().splitlines()
              except OSError:
                  return None
              for line in reversed(lines):
                  if "mode=digest" not in line:
                      continue
                  try:
                      when = datetime.strptime(line.split()[0], "%Y-%m-%dT%H:%M:%SZ")
                  except (ValueError, IndexError):
                      return None
                  return when.replace(tzinfo=timezone.utc).astimezone(LA).date()
              return None

          # Both cron entries fire year-round; exactly one of them lands at 07:00
          # Pacific depending on DST. But GitHub's scheduler is best-effort — it
          # delays runs and sometimes drops them entirely. On 2026-08-12 the
          # 14:00 UTC entry never fired and the 15:00 one arrived at 08:02
          # Pacific, so an hour-equals-7 guard skipped both and no digest went
          # out at all.
          #
          # So the rule is "once per Pacific day, at the first opportunity from
          # 07:00 onwards" rather than "exactly at 07:00". Whichever cron gets
          # through first does the work; the other sees today's line in runs.log
          # and stands down. A late digest beats a missing one.
          already = last_digest_date()
          done_today = already == now.date()
          run = event != "schedule" or (now.hour >= 7 and not done_today)

          print("Pacific local time : %s" % now.strftime("%Y-%m-%d %H:%M %Z"))
          print("event              : %s" % event)
          print("last digest (PT)   : %s" % (already or "never"))
          if run:
              print("-> running")
          elif done_today:
              print("-> today's digest already ran; standing down")
          else:
              print("-> before 07:00 Pacific; this is the off-season cron entry")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("run=%s\n" % ("true" if run else "false"))
          PY

      - name: Run poller — mode:${{ inputs.mode || 'digest' }}
        if: steps.guard.outputs.run == 'true'
        env:
          SMTP_HOST:  ${{ secrets.SMTP_HOST }}
          SMTP_PORT:  ${{ secrets.SMTP_PORT }}
          SMTP_USER:  ${{ secrets.SMTP_USER }}
          SMTP_PASS:  ${{ secrets.SMTP_PASS }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Optional fallback; the poller uses these only when SMTP is unset.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'digest' }}
          ALLOW_ATS_SWITCH: ${{ inputs.allow_ats_switch }}
          URLS: ${{ inputs.urls }}
        run: |
          set -o pipefail
          case "$MODE" in
            seed)
              python3 poller.py --seed
              ;;
            inspect)
              if [ -z "${URLS// /}" ]; then
                echo "::error title=No URLs::inspect needs the 'urls' input — paste one or more careers page URLs, separated by spaces."
                exit 1
              fi
              # Read-only: writes no files, so the commit step finds nothing to do.
              # -f disables globbing so a URL containing ? or * survives expansion.
              set -f
              python3 discover.py --inspect $URLS
              set +f
              ;;
            fix-tokens)
              # Repairs companies.json in place and lets the commit step push it.
              # Exit 2 means discover.py reached nothing and refused to write —
              # a network problem, not 44 dead job boards.
              args="--fix-config"
              if [ "$ALLOW_ATS_SWITCH" = "true" ]; then
                args="$args --allow-ats-switch"
                echo "::warning title=ATS switching enabled::A company may be moved to a different ATS. Check the diff on the resulting commit."
              fi
              rc=0
              python3 discover.py $args || rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "::error title=No endpoint answered::discover.py could not reach any ATS host, so companies.json was left untouched."
              fi
              exit "$rc"
              ;;
            verify)
              # Exits nonzero whenever any entry needs fixing. That is the
              # command's contract, so the run goes red by design — say so,
              # otherwise a red X reads as "the workflow is broken".
              python3 poller.py --verify || {
                echo "::warning title=Config needs fixing::verify exits nonzero when any entry fails to resolve. The plumbing is fine — read the FAIL/WARN list above and repair those tokens."
                exit 1
              }
              ;;
            health)
              python3 poller.py --health || {
                echo "::warning title=Too many companies erroring::health exits nonzero above a 30% error rate. That is the alarm firing, not a workflow bug."
                exit 1
              }
              ;;
            *)
              python3 poller.py --digest
              ;;
          esac

      - name: Validate before committing
        id: validate
        # A pushed commit cannot be validated after the fact: pushes made with the
        # default GITHUB_TOKEN never trigger workflows, so selftest.yml will NOT
        # run on the state/config commits this job creates. The check has to
        # happen here, before anything is committed.
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          set -eo pipefail
          python3 poller.py --selftest
          python3 discover.py --selftest
          python3 - <<'PY'
          import json, sqlite3, sys
          cfg = json.load(open("companies.json"))
          enabled = [e for e in cfg["companies"] if not e.get("disabled")]
          for e in enabled:
              if e["ats"] == "workday":
                  assert all(e.get(k) for k in ("host", "tenant", "site")), e["company"]
              else:
                  assert e.get("token"), e["company"]
          rows = sqlite3.connect("seen.db").execute(
              "select count(*) from seen").fetchone()[0]
          print("config: %d companies (%d enabled) — seen.db: %d rows"
                % (len(cfg["companies"]), len(enabled), rows))
          if rows == 0:
              print("::warning title=Empty database::seen.db has no rows; the next "
                    "digest would treat every open posting as new.")
          PY

      - name: Commit state
        # always(): the poller records non-matching postings even on a run that
        # ends in a delivery failure, and that progress must not be thrown away.
        # But never commit a config or database that just failed validation.
        if: always() && steps.guard.outputs.run == 'true' && steps.validate.outcome == 'success'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in seen.db runs.log matches.jsonl companies.json; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done

          if git diff --cached --quiet; then
            echo "Nothing changed — no commit."
            exit 0
          fi

          echo "Staged: $(git diff --cached --name-only | tr '\n' ' ')"
          stamp="$(date -u +%Y-%m-%dT%H:%MZ)"
          if git diff --cached --name-only | grep -qx 'companies.json'; then
            # Distinct message so a config repair is findable in git log. Note that
            # [skip ci] is decorative either way: pushes made with the default
            # GITHUB_TOKEN never trigger workflows, so no CI runs on these commits.
            # The "Validate before committing" step above is the only gate.
            git commit -m "chore: repair ATS tokens ${stamp}"
          else
            git commit -m "chore: poller state ${stamp} [skip ci]"
          fi

          pushed=false
          for attempt in 1 2; do
            if git push origin "HEAD:${BRANCH}"; then
              pushed=true
              break
            fi
            echo "Push rejected — rebasing onto the latest ${BRANCH} and retrying once."
            # NOTE the inversion: during a rebase "theirs" is *our* replayed commit,
            # not the upstream. seen.db is binary and cannot be merged, and our run
            # polled most recently, so our copy wins. runs.log and matches.jsonl
            # union-merge via .gitattributes, so no history is lost there. Worst
            # case a handful of roles get emailed twice — never dropped.
            git pull --rebase -X theirs origin "${BRANCH}" \
              || echo "Rebase failed; the retry push will probably fail too."
          done

          if [ "$pushed" != true ]; then
            echo "::error::Could not push poller state after 2 attempts. The remote seen.db is unchanged, so today's roles may be emailed again tomorrow."
            exit 1
          fi

      - name: Run summary
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          {
            echo "### Poller run"
            echo ""
            echo '```'
            tail -n 10 runs.log 2>/dev/null || echo "(no runs.log yet)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
